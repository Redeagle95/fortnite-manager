name: Battle Royale checks

on:
  push:
    branches:
      - feat/battle-royale-gameplay
      - feat/battle-royale-tactical-actions
      - feat/battle-royale-five-zone-strategy
      - feat/live-storm-surge-farming
      - feat/live-world-simulation-killfeed
      - feat/extended-zones-team-kill-counters
  pull_request:
    branches:
      - main
      - feat/battle-royale-five-zone-strategy
      - feat/live-storm-surge-farming

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --run
      - name: TypeScript build
        run: npm run build
